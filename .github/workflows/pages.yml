# The game on GitHub Pages: its TypeScript compiled (npm run build: js/*.ts -> dist/js/), its gun models baked and
# tested (npm run bake:models, test:models: assets/models/), then the site published as it is in the repo with dist/
# and the model bundles (assets/models/bundles: the only form of the models the game loads) added. Pull requests and other branches build only (a check that it compiles, bakes and passes).
# One-time setup: Settings -> Pages -> Source: GitHub Actions.
name: pages
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # The guns: the game loads them only as baked glTF (assets/models, git-ignored), so the site bakes them here.
      # Cached on everything a bake reads (the recipes and the baker, the parts data, the authored models): a push that
      # changes none of it reuses the last bake.
      - name: Baked models (cache)
        id: models
        uses: actions/cache@v4
        with:
          path: assets/models
          key: models-${{ hashFiles('tools/**', 'js/parts.ts', 'js/data.ts', 'js/glb.ts', 'js/modelbundles.ts', 'js/gunmaterials.ts', 'models/**', 'package-lock.json') }}
      - name: Bake the models
        if: steps.models.outputs.cache-hit != 'true'
        run: npm run bake:models -- -j 4
      - run: npm run test:models
      - name: The site
        run: |
          mkdir -p _site
          # the game loads the models only from assets/models/bundles (js/modelbundles.ts): the loose packs, props and whole-gun files are for the tools and tests, not shipped
          rsync -a --exclude node_modules --exclude _site --exclude .git --exclude .github --exclude /assets/models/guns --exclude /assets/models/parts --exclude /assets/models/props ./ _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
